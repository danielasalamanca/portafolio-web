<body class="sin-fondo">
  <header>
    <a href="../index.html">
      <img src="../img/danielasalamanca.png" alt="danielasalamanca" class="logo-header" />
    </a>
    <ul class="menu-links">
      <li><a href="trabajos.html" class="activo">Trabajos</a></li>
      <li><a href="about.html">Sobre mí</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </header>

    <section>
    <div class="proyecto-container">
         <div class="slider">
      <button class="slider-arrow left" onclick="prevImg()" aria-label="Anterior">
        <img src="../img/flechaiz.png" alt="Anterior">
      </button>
      <img id="slider-img" src="../img/sheet_hidratante_back.jpg" alt="SHEET! Etiquetas Shampoo">
      <button class="slider-arrow right" onclick="nextImg()" aria-label="Siguiente">
        <img src="../img/flechade.png" alt="Siguiente">
      </button>
    </div>
      <div class="proyecto-info">
         <div class="proyecto-info">
      <div class="badge-año">2026</div>
      <h2>SHEET! Etiquetas Shampoo</h2>
      <p>Desarrollo del diseño de etiquetas para la nueva línea de shampoos anticaspa de SHEET!, creando la identidad visual de sus dos variantes: Anticaspa Hidratante y Anticaspa Limpieza Profunda.</p>
    </div>
    </div>
  </section>

  </div>
</div>
  </section>

  </footer>

<script>
      const images = [
      "../img/sheet_hidratante_back.jpg",
      "../img/sheet_hidratante.png",
      "../img/sheet_hidratante2.png",
      "../img/sheet_limpieza.png",
    ];
  let current = 0;
    const sliderImg = document.getElementById('slider-img');
    function showImg(idx) {
      sliderImg.src = images[idx];
    }
    function prevImg() {
      current = (current - 1 + images.length) % images.length;
      showImg(current);
    }
    function nextImg() {
      current = (current + 1) % images.length;
      showImg(current);
    }
    showImg(current);
  </script>
<script>window.addEventListener("load",function(){document.body.classList.add("loaded");});</script>
</body>
